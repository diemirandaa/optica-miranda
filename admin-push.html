<!doctype html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de envío — Óptica Miranda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
--brand:#0B4A32;
--brand-dark:#062B1D;
--paper:#FBF9F3;
--ink:#0F1D17;
--ink-soft:#425049;
--ink-faint:#7C8880;
--brand-line:rgba(11,74,50,0.16);
--gold-soft:#D9C48E;
--white:#FFFFFF;
--danger:#8C2F2F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Karla",-apple-system,sans-serif;padding:40px 20px;}
.wrap{max-width:520px;margin:0 auto;}
h1{font-family:"Domine",serif;font-size:22px;color:var(--brand-dark);margin:0 0 6px;}
.sub{color:var(--ink-faint);font-size:13.5px;margin-bottom:28px;}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;margin-top:18px;}
input[type=text],input[type=password],textarea{
width:100%;padding:11px 12px;border:1px solid var(--brand-line);border-radius:4px;font-size:14.5px;
font-family:inherit;background:var(--white);color:var(--ink);
}
textarea{resize:vertical;min-height:80px;}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;}
button{
margin-top:24px;width:100%;height:48px;border-radius:4px;border:none;background:var(--brand);color:var(--white);
font-weight:600;font-size:15px;cursor:pointer;font-family:inherit;
}
button:hover{background:var(--brand-dark);}
button:disabled{opacity:0.6;cursor:default;}
.result{margin-top:20px;padding:14px 16px;border-radius:4px;font-size:14px;display:none;white-space:pre-wrap;}
.result.ok{display:block;background:rgba(11,74,50,0.08);border:1px solid var(--brand-line);color:var(--ink);}
.result.err{display:block;background:rgba(140,47,47,0.08);border:1px solid rgba(140,47,47,0.3);color:var(--danger);}
.hint{margin-top:8px;font-size:12px;color:var(--ink-faint);}
</style>
</head>
<body>
<div class="wrap">
<h1>Panel de envío — Óptica Miranda</h1>
<p class="sub">Enviá una notificación push a todos los suscriptores de la landing.</p>

<label for="secret">Clave de administrador</label>
<input type="password" id="secret" autocomplete="off" placeholder="ADMIN_SECRET">
<p class="hint">La misma clave que se configuró en Cloudflare como ADMIN_SECRET. No se guarda en ningún lado.</p>

<label for="title">Título</label>
<input type="text" id="title" placeholder="Ej: Nuevos modelos esta semana">

<label for="message">Mensaje</label>
<textarea id="message" placeholder="Ej: Mirá los armazones nuevos que llegaron, hay stock limitado."></textarea>

<label for="url">Link al hacer clic (opcional)</label>
<input type="text" id="url" placeholder="https://opticamiranda.com.py/">

<button id="sendBtn">Enviar notificación</button>

<div class="result" id="result"></div>
</div>

<script>
(function(){
var SEND_URL = "https://optica-miranda-push.diegomiranda2011.workers.dev/send";

var btn = document.getElementById("sendBtn");
var result = document.getElementById("result");

btn.addEventListener("click", function(){
var secret = document.getElementById("secret").value.trim();
var title = document.getElementById("title").value.trim();
var message = document.getElementById("message").value.trim();
var url = document.getElementById("url").value.trim();

result.className = "result";
result.textContent = "";

if (!secret) {
result.className = "result err";
result.textContent = "Falta la clave de administrador.";
return;
}
if (!title || !message) {
result.className = "result err";
result.textContent = "Falta el título o el mensaje.";
return;
}

btn.disabled = true;
btn.textContent = "Enviando...";

var body = { title: title, message: message };
if (url) body.url = url;

fetch(SEND_URL, {
method: "POST",
headers: {
"Content-Type": "application/json",
"X-Admin-Secret": secret
},
body: JSON.stringify(body)
}).then(function(resp){
return resp.json().then(function(data){ return { status: resp.status, data: data }; });
}).then(function(res){
btn.disabled = false;
btn.textContent = "Enviar notificación";

if (res.status === 401) {
result.className = "result err";
result.textContent = "Clave incorrecta. Revisá el ADMIN_SECRET.";
return;
}
if (res.status !== 200 || !res.data.ok) {
result.className = "result err";
result.textContent = "Error: " + (res.data.error || "no se pudo enviar.");
return;
}

var lines = [];
lines.push("Enviadas: " + res.data.sent);
lines.push("Fallidas: " + res.data.failed);
lines.push("Suscripciones vencidas eliminadas: " + res.data.removed);
if (res.data.errors && res.data.errors.length) {
lines.push("");
lines.push("Detalle de errores:");
res.data.errors.forEach(function(e){ lines.push("- " + e); });
}

result.className = "result ok";
result.textContent = lines.join("\n");
}).catch(function(err){
btn.disabled = false;
btn.textContent = "Enviar notificación";
result.className = "result err";
result.textContent = "Error de red: " + err.message;
});
});
})();
</script>
</body>
</html>
